[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-architect"
version = "0.1.0"
description = "Domain-agnostic scaffold generator for agentic projects — designs the minimal viable agent architecture from plain-language requirements and generates a portable project usable with Claude Code, OpenCode, Codex CLI, or any AGENTS.md-compatible runtime."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Agentic Project Architect contributors" }]
keywords = ["agents", "claude-code", "opencode", "codex", "scaffolding", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/juanfarcik/agent-project-architect"
Issues = "https://github.com/juanfarcik/agent-project-architect/issues"

[project.scripts]
agent-project = "agent_project.cli:main"

[tool.setuptools]
packages = ["agent_project"]

[tool.setuptools.package-data]
agent_project = []
